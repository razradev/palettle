<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{art[0].author}}'s Art for {{art[0].date_created}}</title>
    <link rel="stylesheet" href="/static/styles/pico.min.css" />
    <link rel="stylesheet" href="/static/styles/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>{{art[0].author}}'s Art for {{art[0].date_created}}</h1>
      <div class="personal-canvas-container">
        <canvas class="personal-canvas" id="{{art[0].author}}"
          >{{art[0].image_data}}</canvas
        >
        <form class="art-form">
          <button type="submit">Like</button>
          <p>{{art[0].likes}}</p>
          <button type="submit">Dislike</button>
          <p>{{art[0].likes}}</p>
        </form>
      </div>
    </main>
    <script>
      const palette = {{palette | tojson}};
      const art = {{art | tojson}};
    </script>
    <script src="/static/scripts/constants.js"></script>
    <script src="/static/scripts/palette.js"></script>
    <script src="/static/scripts/gallery.js"></script>
  </body>
</html>
