<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palettle</title>
    <link rel="stylesheet" href="/static/styles/pico.min.css" />
    <link rel="stylesheet" href="/static/styles/style.css" />
    <link rel="icon" type="image/x-icon" href="/static/images/palettle.png" />
  </head>
  <body>
    {% include '_navbar.html' %}
    <main class="container">
      <section class="hero">
        <div class="hero-text">
          <h2>
            Pixel by <span class="pixel-font">Pixel</span>.<br />
            Make Art.
          </h2>
          <p>
            Every day you get a new prompt and palette.<br />Draw something
            cool.
          </p>
          <a class="button-style" href="/sign-up" style="width: max-content"
            >Start Drawing<span style="width: 0.5rem"></span><i>&#xEA6C;</i></a
          >
        </div>
        <img class="hero-image" src="/static/images/palettle.gif" />
      </section>
      <div style="height: calc(2 * var(--pico-spacing))"></div>
      <article>
        <a href="/gallery" style="text-decoration: none">
          <h2>
            Gallery
            <i>&#xEA6C;</i>
          </h2>
        </a>
        <div class="gallery-slide">
          {% for a in art %}
          <a class="gallery-canvas-link" href="/art/{{a.author}}">
            <p class="prompt-small">{{a.prompt}}</p>
            <p class="username-small">{{a.author}}</p>
            <p class="likes-count">
              {{(a.likes or 0) | int - (a.dislikes or 0) | int}}
            </p>
            <canvas class="gallery-canvas" id="{{loop.index0}}"></canvas
          ></a>
          {% endfor %}
        </div>
      </article>
    </main>
    <script>
      const art = {{art | tojson}};
    </script>
    <script src="/static/scripts/constants.js"></script>
    <script src="/static/scripts/palette.js"></script>
    <script src="/static/scripts/gallery.js"></script>
  </body>
</html>
